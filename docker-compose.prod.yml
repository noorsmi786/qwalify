version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    container_name: qwalify_frontend
    restart: unless-stopped
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.qwalify.rule=Host(`qwalify.online`) || Host(`www.qwalify.online`)"
      - "traefik.http.routers.qwalify.entrypoints=websecure"
      - "traefik.http.routers.qwalify.tls=true"
      - "traefik.http.routers.qwalify.tls.certresolver=letsencrypt"
      - "traefik.http.services.qwalify.loadbalancer.server.port=80"
      - "traefik.http.routers.qwalify-http.rule=Host(`qwalify.online`) || Host(`www.qwalify.online`)"
      - "traefik.http.routers.qwalify-http.entrypoints=web"
      - "traefik.http.routers.qwalify-http.middlewares=redirect-to-https"

networks:
  root_default:
    external: true
