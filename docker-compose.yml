version: '3.8'

services:
  # ─── 1. Traefik Reverse Proxy & Automatic SSL ───────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: qwalify_traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Automatic HTTP -> HTTPS redirect
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt SSL
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-admin@qwalify.online}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - qwalify_network

  # ─── 2. Qwalify Frontend Dashboard (React + Vite + NGINX) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qwalify_frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-qwalify.online}`) || Host(`www.${DOMAIN:-qwalify.online}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - qwalify_network

  # ─── 3. Evolution API (Self-Hosted WhatsApp Gateway) ────────────────────────
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: qwalify_evolution_api
    restart: unless-stopped
    environment:
      - SERVER_URL=https://${WA_DOMAIN:-wa.qwalify.online}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-qwalify_evolution_secret_key_2026}
      - DATABASE_ENABLED=false
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - SESSIONS_TYPE=redis
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${SUPABASE_URL}/functions/v1/whatsapp-webhook
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`${WA_DOMAIN:-wa.qwalify.online}`)"
      - "traefik.http.routers.evolution.entrypoints=websecure"
      - "traefik.http.routers.evolution.tls.certresolver=myresolver"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"
    depends_on:
      - redis
    networks:
      - qwalify_network

  # ─── 4. Redis (For Evolution API Session Caching) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qwalify_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - qwalify_network

volumes:
  redis_data:

networks:
  qwalify_network:
    driver: bridge
